plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.peetz0r.a7hacks'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.peetz0r.a7hacks'
        minSdk 10
        targetSdk 10
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
